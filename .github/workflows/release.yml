name: Release

# guard -> verify -> release. Merging the staging -> main release PR lands here,
# and semantic-release tags the next version from the commit types since the
# last tag: feat -> minor, fix or perf -> patch, BREAKING CHANGE -> major.
# It tags and publishes a GitHub Release; it commits nothing to main.
#
# npm publishing is paused ("npmPublish": false in .releaserc.json): npm's
# registry rejects the OIDC identity GitHub now issues for this account
# (npm/cli#9969), so each release is published to npm by hand, per the README.
# Trusted publishing is already set up on npmjs.com: once npm fixes the bug,
# set npmPublish back to true. id-token: write stays for that.

on:
  push:
    branches:
      - main

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # enough to see HEAD's parents

      # A squash collapses staging into one commit whose subject is the release
      # PR's title, chore(release): ..., so semantic-release would see no feat
      # or fix and release nothing.
      - name: Refuse a squashed release
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -lt 3 ]; then
            echo "::error::main received a non-merge commit. Merge staging -> main with a MERGE COMMIT, never squash."
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # lets npm verify this workflow instead of a stored token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads every commit since the last tag
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
