name: Verify

# What "good" means for clio-brand, in one place: quality.yml calls it for pull
# requests, release-pr.yml for each push to staging, release.yml for the merge
# commit on main.

on:
  workflow_call:

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
